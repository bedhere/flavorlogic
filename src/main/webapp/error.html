<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>页面出现异常 · 食之有理 FlavorLogic</title>
  <link rel="stylesheet" href="lib/bootstrap.min.css" />
  <link rel="stylesheet" href="css/app.css?v=3" />
  <link rel="stylesheet" href="css/pages.css?v=3" />
</head>
<body>
<!-- 独立错误页：无侧栏、不依赖登录态，因此不调用 FL.start，只在末尾做少量内联处理 -->
<main style="min-height:100vh;display:grid;place-items:center;padding:32px 20px">
  <section class="panel" style="width:min(520px,100%)">
    <div class="panel-body" style="padding:32px">
      <a class="brand" id="errorBrand" href="index.html">
        <span class="brand-mark"></span>
        <span>食之有理 <span style="font-weight:500;opacity:.72">FlavorLogic</span></span>
      </a>

      <div id="errorCode" style="margin-top:26px;color:var(--accent);font-size:54px;font-weight:600;line-height:1">500</div>
      <h1 id="errorTitle" style="margin:12px 0 10px;font-size:24px;font-weight:500">页面出现异常</h1>
      <p id="errorDesc" style="margin:0;color:var(--muted);font-size:13px;line-height:1.9">
        请求未能正常完成，你可以返回工作台或首页继续使用。
      </p>

      <div class="form-actions" style="justify-content:flex-start;margin-top:26px">
        <a class="primary-btn" id="toDashboard" href="dashboard.html">返回工作台</a>
        <a class="secondary-btn" id="toHome" href="index.html">返回首页</a>
      </div>

      <div class="notice" style="margin-top:22px">
        若该提示反复出现，请把当前页面地址与操作步骤反馈给平台管理员，便于快速定位问题。
      </div>
    </div>
  </section>
</main>

<script src="lib/jquery.min.js"></script>
<script src="lib/bootstrap.bundle.min.js"></script>
<script src="js/common.js?v=4"></script>
<script>
  /* 错误文案表：按 ?code= 参数（403 / 404 / 500）切换，其他情况使用默认文案 */
  (function () {
    'use strict';

    var TEXT = {
      '403': { title: '没有访问权限', desc: '当前账号无权访问该页面，若确需使用，请联系平台管理员开通对应权限。' },
      '404': { title: '页面不存在', desc: '你访问的页面可能已被移除或地址输入有误，请检查链接后重试。' },
      '500': { title: '服务器内部错误', desc: '服务暂时无法处理该请求，请稍后重试；若持续出现，请联系平台管理员。' }
    };
    var FALLBACK = { title: '页面出现异常', desc: '请求未能正常完成，你可以返回工作台或首页继续使用。' };

    var matched = /[?&]code=([0-9]{3})/.exec(window.location.search);
    var code = matched ? matched[1] : '';
    var text = TEXT[code] || FALLBACK;

    document.getElementById('errorCode').textContent = code || '!';
    document.getElementById('errorTitle').textContent = text.title;
    document.getElementById('errorDesc').textContent = text.desc;
    document.title = text.title + ' · 食之有理 FlavorLogic';

    // 用上下文路径重写链接：部署在 /flavorlogic 等子路径下也能正确跳转
    var ctx = (window.FL && window.FL.ctx) || '';
    document.getElementById('errorBrand').href = ctx + '/index.html';
    document.getElementById('toDashboard').href = ctx + '/dashboard.html';
    document.getElementById('toHome').href = ctx + '/index.html';
  }());
</script>
</body>
</html>
